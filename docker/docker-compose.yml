services:
  postgres:
    image: "postgres:18"
    environment:
      POSTGRES_PASSWORD: gauserpassword
      POSTGRES_USER: gauser
      POSTGRES_DB: goapp
    ports:
      - "5432:5432"
    networks:
      - goapp_network

  goapp:
    image: golang:1.27
    volumes:
      - ${PWD}/../:/app
    working_dir: /app
    tty: true
    environment:
      TEMPLATES_BASEPATH: /app/cmd/server/http/web/templates
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_STORENAME: "goapp"
      POSTGRES_USERNAME: "gauser"
      POSTGRES_PASSWORD: "gauserpassword"
    command: ["go", "run", "inits.go", "shutdown.go", "main.go"]
    ports:
      - "8080:8080"
      - "2000:2000"
    depends_on:
      - postgres
    networks:
      - goapp_network
    dns:
      - "1.1.1.1"
      - "8.8.8.8"

networks:
  goapp_network:
